{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Change Password</h2>

    <form method="POST" class="card p-4 shadow rounded-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary rounded-3">
            Update Password
        </button>
    </form>
</div>
{% endblock %}
