{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - English Learning</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
}

.login-box h1 {
    margin-bottom: 30px;
}

.login-box input {
    width: 100%;
    padding: 12px 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}

.login-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

.login-box button:hover {
    background-color: #2563eb;
}

.login-box .register-btn {
    background-color: #f87171;
    margin-top: 15px;
}

.login-box .register-btn:hover {
    background-color: #dc2626;
}

.messages {
    margin-top: 15px;
    color: #ffdddd;
}
</style>
</head>
<body>

<div class="login-box">
    <h1>Login</h1>
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <form action="{% url 'register' %}">
        <button type="submit" class="register-btn">Register</button>
    </form>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
</div>

</body>
</html>
