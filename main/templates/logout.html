{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logout</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.logout-box {
    background: rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.logout-box h1 {
    margin-bottom: 20px;
}

.logout-box p {
    margin-bottom: 30px;
}

.logout-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #f87171;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 10px;
}

.logout-box button:hover {
    background-color: #dc2626;
}

.logout-box .cancel-btn {
    background-color: #3b82f6;
}

.logout-box .cancel-btn:hover {
    background-color: #2563eb;
}
</style>
</head>
<body>

<div class="logout-box">
    <h1>Logout</h1>
    <p>Are you sure you want to logout?</p>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <a href="{% url 'dashboard' %}"><button class="cancel-btn">Cancel</button></a>
</div>

</body>
</html>
